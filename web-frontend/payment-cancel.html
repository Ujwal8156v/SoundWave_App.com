<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled | SoundWave Hi-Fi Music</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #080811;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 77, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.12) 0%, transparent 40%);
        }

        .cancel-card {
            background: rgba(18, 18, 30, 0.65);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(255, 77, 0, 0.15);
            animation: cardScaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardScaleIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .cancel-badge-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(255, 77, 0, 0.05));
            border: 2px solid #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
        }

        .cancel-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 0.5rem;
            background: linear-gradient(135deg, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cancel-card p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .details-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.2rem 1.4rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
        }

        .details-row:last-child {
            border-bottom: none;
        }

        .details-label {
            color: rgba(255, 255, 255, 0.6);
        }

        .details-value {
            font-weight: 700;
            color: #ffffff;
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-retry {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff0055, #ff4d00);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 0.75rem;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.5);
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="cancel-card">
        <div class="cancel-badge-icon">⚠️</div>
        <h1>Payment Incomplete</h1>
        <p>Your payment process was cancelled. No charges were made to your account.</p>

        <div class="details-box">
            <div class="details-row">
                <span class="details-label">Selected Tier:</span>
                <span class="details-value" id="planTitleDisplay">SoundWave Plus</span>
            </div>
            <div class="details-row">
                <span class="details-label">Amount:</span>
                <span class="details-value" id="amountDisplay">₹59.00</span>
            </div>
            <div class="details-row">
                <span class="details-label">Transaction Status:</span>
                <span class="status-cancelled">CANCELLED / NOT DEBITED ⚠️</span>
            </div>
        </div>

        <a href="index.html#pricing" class="btn-retry" id="retryPaymentBtn">🔄 Retry Payment</a>
        <a href="index.html#home" class="btn-home">🏠 Return to Home Page</a>
        <div class="footer-note">🔒 SSL Encrypted • SoundWave Security Shield</div>
    </div>

    <script>
        // Parse URL parameters dynamically
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        
        const plan = urlParams.get('plan') || hashParams.get('plan') || 'plus';
        const amount = urlParams.get('amount') || hashParams.get('amount') || (plan === 'family' ? '₹179.00' : '₹59.00');

        const planNames = {
            free: 'SoundWave Free',
            plus: 'SoundWave Plus',
            family: 'Family Premium VIP'
        };

        const planTitle = planNames[plan] || 'SoundWave Plus';

        document.getElementById('planTitleDisplay').textContent = planTitle;
        document.getElementById('amountDisplay').textContent = amount;
    </script>
</body>
</html>
